<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Project Board</h1>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <div class="column-header-bar">
    <div class="column-header-spacer"></div>
    <div class="column-headers">
      <div class="column-header stage-planned">Planned</div>
      <div class="column-header stage-in_progress">In Progress</div>
      <div class="column-header stage-blocked">Blocked</div>
      <div class="column-header stage-done">Done</div>
    </div>
  </div>

  <main class="board" id="board">
    <div class="project-list" id="project-list"></div>

    <!-- Empty state, shown when there are no projects -->
    <div class="empty-state" id="empty-state" hidden>
      <p>No projects yet.</p>
      <p class="empty-state-sub">Use the gear icon to add your first project.</p>
    </div>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <div class="modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-header">
      <h2 id="settings-modal-title">Settings</h2>
      <button class="modal-close-btn" id="settings-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <section class="settings-section">
        <h3 class="settings-section-title">Projects</h3>
        <button class="btn-primary" id="new-project-btn">+ New Project</button>
      </section>
      <section class="settings-section">
        <h3 class="settings-section-title">Data</h3>
        <div class="settings-actions-row">
          <button class="btn-secondary" id="export-btn">Export backup</button>
          <button class="btn-secondary" id="import-btn">Import backup</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden />
      </section>
    </div>
  </div>

  <div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <div class="modal-header">
      <h2 id="project-modal-title">New Project</h2>
      <button class="modal-close-btn" id="project-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label" for="project-name-input">Name</label>
        <input type="text" id="project-name-input" placeholder="Project name" maxlength="80" />
      </div>
      <div class="field-group">
        <label class="field-label" for="project-summary-input">Summary <span class="optional">optional</span></label>
        <textarea id="project-summary-input" rows="2" placeholder="What is this project about?" maxlength="400"></textarea>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="project-due-input">Due date <span class="optional">optional</span></label>
          <input type="date" id="project-due-input" />
        </div>
        <div class="field-group">
          <label class="field-label" id="priority-label">Priority</label>
          <div class="priority-picker" id="priority-picker" role="group" aria-labelledby="priority-label">
            <button type="button" class="priority-btn" data-value="1">1</button>
            <button type="button" class="priority-btn" data-value="2">2</button>
            <button type="button" class="priority-btn" data-value="3">3</button>
            <button type="button" class="priority-btn" data-value="4">4</button>
            <button type="button" class="priority-btn" data-value="5">5</button>
          </div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" id="color-label">Color</label>
        <div class="color-picker" id="color-picker" role="group" aria-labelledby="color-label"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="project-delete-btn" hidden>Delete</button>
      <button class="btn-save" id="project-save-btn">Save</button>
    </div>
  </div>

  <div class="modal" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-header">
      <h2 id="card-modal-title">New Card</h2>
      <button class="modal-close-btn" id="card-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label" for="card-title-input">Title</label>
        <input type="text" id="card-title-input" placeholder="Card title" maxlength="120" />
      </div>
      <div class="field-group">
        <label class="field-label" for="card-desc-input">Description <span class="optional">optional</span></label>
        <textarea id="card-desc-input" rows="4" placeholder="Notes, details..." maxlength="4000"></textarea>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="card-due-input">Due date <span class="optional">optional</span></label>
          <input type="date" id="card-due-input" />
        </div>
        <div class="field-group" id="card-start-group">
          <label class="field-label">Started</label>
          <div class="static-value" id="card-start-value">—</div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="card-tag-input">Tags <span class="optional">optional</span></label>
        <div class="tags-wrap" id="card-tags-wrap">
          <div class="tag-chips" id="card-tag-chips"></div>
          <input type="text" id="card-tag-input" placeholder="Add a tag and press Enter" maxlength="24" />
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="card-delete-btn" hidden>Delete</button>
      <button class="btn-save" id="card-save-btn">Save</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
